<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="This is the CWA Help Desk Appoint, come here if you ever need any assistance!">
    <meta name="keywords" content="CWA, Help Desk, Appoint, Assistance">
    <meta name="author" content="Tuan Dat Quach">
    <title>CWA Help Desk Appointment</title>
</head>

<body>
    <a href="https://www.swin.edu.au/" target="_blank">
        <img src="logo.png" alt="The official logo of Swinburne University of Technology">
    </a>
    <br>
    <main> 
        <form action="submit.php" method="post">
            <header>
                <h1>CWA Help Desk Appointment</h1>
            </header>

            <section>
                <p>
                The Help Desk is located in ATC620. Open to 10:30 to 19:00 Monday to Friday
                <br><br>
                Check Blackboard for when CWA tutors will be there
                </p>
            </section>

            <fieldset>
                <legend>Student details</legend>
                <br>
                <label for="studentID">Student ID</label>
                <input type="text" id="studentID" name="studentID" pattern="^\d{7,10}$" title="Please enter a student ID from 7 - 10 numbers" required>
                <br><br>
                <label for="GivenName">Student Name </label><input type="text" id="GivenName" name="GivenName" maxlength="15" pattern="^[A-Za-z\s]+$" required>
                <label for="FamilyName"> Family Name </label><input type="text" id="FamilyName" name="FamilyName" maxlength="15" pattern="^[A-Za-z\s]+$" required>
                <br><br>
            </fieldset>

            <fieldset>
                <legend>Your unit</legend>
                <br>
                <label for="COS10026">
                <input type="radio" id="COS10026" name="unit" value="COS10026" required="required"> COS 10026 &nbsp;
                </label>

                <label for="COS10009 ">
                <input type="radio" id="COS 10009" name="unit" value="COS 10009" required> COS 10009 &nbsp;
                </label>

                <label for="COS 10004">
                <input type="radio" id="COS 10004" name="unit" value="COS 10004" required> COS 10004 &nbsp;
                </label>
                <br><br>
                <label for="tutor">Your Tutor</label>
                <select id="tutor" name="tutor" required>
                    <option value="">Please Select</option>
                    <option value="Nick">Nick</option>
                    <option value="Feixue Yan">Feixue Yan</option>
                    <option value="Razeen Hashmi">Razeen Hashmi</option>
                    <option value="Rahul Raghavan">Rahul Raghavan</option>
                </select>
                <br><br>
            </fieldset>

            <fieldset>
                <legend>Issue</legend>
                <br>
                <label for="HTML">
                HTML <input type="checkbox" id="HTML" name="HTML" value="HTML" checked="checked">&nbsp;
                </label>
            
                <label for="CSS">
                CSS <input type="checkbox" id="CSS" name="CSS" value="CSS">&nbsp;
                </label>
            
                <label for="JavaScript">
                JavaScript <input type="checkbox" id="JavaScript" name="JavaScript" value="JavaScript">&nbsp;
                </label>

                <label for="PHP">
                PHP <input type="checkbox" id="PHP" name="PHP" value="PHP">&nbsp;
                </label>

                <label for="MySQL">
                MySQL <input type="checkbox" id="MySQL" name="MySQL" value="MySQL">&nbsp;
                </label>
                <br><br>
                Description of Issue<br>
                <textarea id="isdescript" name="isdescript" rows="4" cols="50" placeholder="Write description of your problem here..." required></textarea>
                <br><br>
            </fieldset>

            <fieldset>
                <legend>Preferred Date/Time</legend>
                <label for="date">Date</label>
                <input type="text" id="date" name="date" placeholder="dd/mm/yyyy" pattern="(0[1-9]|[12][0-9]|3[01])\/(0[1-9]|1[0,1,2])\/(19|20)\d{2}" required>
                <br>
                <label for="time">Time</label>
                <input type="text" id="time" name="time" placeholder="00:00" pattern="([01]?[0-9]|2[0-3]):[0-5][0-9]" required>
                <br>
            </fieldset>

            <input type="submit" value="Book">
            <input type="reset" value="Reset form">
        </form>
     </main>
</body>
</html>
